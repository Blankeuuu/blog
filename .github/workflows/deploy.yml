name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Minimalne uprawnienia do publikacji na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zapewnia jedno jednoczesne wdrożenie
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content & CMS schema
        run: npm run validate

      - name: TypeScript check
        run: npm run check

      - name: Run unit & regression tests
        run: npm test

      - name: Build static site with Pagefind search
        env:
          SITE_ORIGIN: https://blankeuuu.github.io
          SITE_BASE: /blog/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
